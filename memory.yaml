# ─────────────────────────────────────────────────────────────
# 记忆子系统配置（可安全入库：不含密钥）
# 数据库连接沿用 .env 的 PG_HOST/PG_PORT/PG_DB/PG_USER/PG_PASSWORD
# 设计见 docs/memory-design.md，实施见 docs/memory-implementation-plan.md
# ─────────────────────────────────────────────────────────────

backend: postgres        # postgres | sqlite（P1–P3 期间保留 sqlite 以便回滚）

short_term:
  conversation_window: 30   # 群聊：同群最近 N 条（跨线程，按时间）
  thread_window: 12         # 私聊：个人线程最近 K 条

compression:
  trigger_turns: 50      # 唯一触发器：未摘要的群 user 消息达到 N 条
  summary_max_tokens: 500
  model: deepseek-v41-flash   # 引用 model.yaml 中的模型名（低成本）
  full_rebuild_every: 10     # 每 N 次增量做一次全量重建

budget:                  # 各层注入预算（token）
  long_term: 800
  group_summary: 600
  conversation_window: 4000
  thread_window: 2500

retention:
  raw_days: 30           # L1 原文保留天数
  summary_days: 365      # L2 摘要保留天数
  memory_stale_days: 180 # L3 超过该天数未确认视为失效（不注入）
