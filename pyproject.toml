[project]
name = "qq_bot_official"
version = "0.1.0"
description = "QQ 开放平台（官方 API）专用机器人"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    # 发图给视觉模型前做压缩缩放，压低服务端视觉编码延迟（见 note #48）
    "Pillow>=10.0.0",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "asyncpg>=0.32.0",
    "nonebot-adapter-qq>=1.7.3",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff",
    "pytest",
    "pytest-asyncio",
]

# uv 识别的是顶层 [dependency-groups]（此前误写成 [project.dependency-groups]，
# 导致 uv sync 从不安装 pytest/ruff）
[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x 默认每个用例新建事件循环；asyncpg 连接池绑定创建时的循环，
# 必须让 fixture 与用例共享同一个 session 级循环
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
# pytest 9 默认把命名空间包的父目录插入 sys.path，会让 qq_bot 解析到仓库根，
# 导致 qq_bot.memory 等子包导入失败。项目用的是"仓库根 + 内层 qq_bot 包"结构，显式关闭。
consider_namespace_packages = false
[tool.nonebot]
plugin_dirs = ["qq_bot/plugins"]
builtin_plugins = ["echo", "single_session"]



[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

# 测试代码不强制类型注解与简化风格：夹具参数是 pytest 注入的
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "SIM", "PLR2004"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
