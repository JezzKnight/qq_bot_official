# chat 系统提示词链路 v2
# modules 的顺序就是拼接顺序；条目支持两种写法：
#   - persona.v1                       # 简单模块（name.version）
#   - name: platform-qq                # 条件模块
#     version: v1
#     when: qq                         # onebot / qq / multimodal
# name 对应 chat/{name}.md；version 是版本标记（改内容时手动递增）。
# multimodal 仅在 include_multimodal=True（主模型支持视觉/视频）时追加。
version: 2
modules:
  - persona.v1
  - constraints.v1
  - guidelines.v1
  - capabilities.v1
  - name: platform-onebot
    version: v1
    when: onebot
  - name: platform-qq
    version: v1
    when: qq
  - style.v1
  - name: multimodal
    version: v1
    when: multimodal
