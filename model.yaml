# ─────────────────────────────────────────────────────────────
# 模型参数配置（可安全入库：本文件不含任何密钥）
#
# 密钥只写在 .env 里，这里用 api_key_env 指向“环境变量名”。
# 参数合并顺序：models[].params > defaults（缺省项自动继承 defaults）
#
# 字段说明：
#   name          展示名：/model 指令、QQ 里看到的、落库记录都用它
#   api_model     实际发给平台的 model 字段（不写则等于 name）
#   base_url      OpenAI 兼容端点（会自动补 /chat/completions）
#   api_key_env   该模型取哪个环境变量作为密钥
#   params        可选：temperature / max_tokens / timeout / connect_timeout
# ─────────────────────────────────────────────────────────────

default_model: deepseek-v41-flash

defaults:
  temperature: 1.0
  max_tokens: 16384
  timeout: 180          # 读超时（秒）
  connect_timeout: 10   # 连接超时（秒）

models:
  # ── 智谱 BigModel（GLM）──
  - name: glm-5.3-flash
    base_url: https://open.bigmodel.cn/api/coding/paas/v4/
    api_key_env: GLM_API_KEY
    params:
      temperature: 1.0
      max_tokens: 16384
  - name: glm-5.3
    base_url: https://open.bigmodel.cn/api/coding/paas/v4/
    api_key_env: GLM_API_KEY
  # ── DeepSeek（官方 api.deepseek.com）──
  # 官方 model 字段已改为 deepseek-flash / deepseek-v4-pro；
  # 展示名保持 deepseek-v41-flash，避免 QQ 里换名字。
  - name: deepseek-v41-flash
    api_model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    params:
      max_tokens: 8192
  - name: deepseek-v4-pro
    api_model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    params:
      max_tokens: 8192
