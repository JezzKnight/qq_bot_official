# 表情包清单：文件放在 data/data/ai_chat/stickers/
# 名称用于模型调用 send_sticker(name=...)，description 写"什么时候该发"
# 未在清单中出现的文件会以文件名为名称自动导入；exclude 里的文件不导入

exclude:
  - online.jpg   # 上线通知用图，不是表情包
  - what.jpg     # 空回复兜底图，不是表情包

stickers:
  - file: wuyu.jpg
    name: 无语
    tags: [无语, 无奈, 沉默]
    description: 想表达无语、无奈、懒得回应的情绪时使用；例如用户反复发送无意义重复内容。

  - file: tiaodou.gif
    name: 挑逗
    tags: [帮助后, 俏皮, 得意]
    description: 用户求助时，在给完建议/帮助之后发送，作为俏皮的收尾。

  - file: enh.jpg
    name: 震惊
    tags: [震惊, 惊讶, 难以置信]
    description: 想表达震惊、难以置信时使用。

  - file: dance.gif
    name: 跳舞
    tags: [跳舞, 才艺, 表演]
    description: 用户明确要求看 bot 跳舞时使用。

  - file: lai.gif
    name: 来
    tags: [索要, 催促, 互动]
    description: 想从用户那里要更多信息/资源时使用；同时在回复文字里喊「X来！X来！」（例如「token来！token来！」）。

  - file: ee.gif
    name: 想吃
    tags: [食物, 馋, 想吃, ee]
    description: 和用户讨论食物、bot 表达想吃时使用。
